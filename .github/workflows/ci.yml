name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Lint
        run: |
          pip install 'ruff==0.16.2'   # 釘住版本：ruff 升級會帶新規則，CI 不該在沒人改碼時變紅
          ruff check .

      # role_gate.py 是這個 repo 唯一的強制點。它的每一條 deny 都是一個宣稱，
      # 沒有測試的宣稱在重構後會安靜地消失，而 CI 依然是綠的。
      - name: Tests
        run: python -m unittest discover -s tests -v

      # lockfile 會腐爛：有人改了 package.json 卻沒重新產生 lock，下一個 clone
      # 的人裝到的東西就跟這裡不一樣。--frozen-lockfile 就是在問「這兩份還一致嗎」。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: LINE channel lockfile
        working-directory: channels/line
        run: bun install --frozen-lockfile

      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # tools/ 直接在使用者主機上跑指令，語法或引號錯誤的後果比一般腳本嚴重
          shellcheck -S warning tools/*.sh || true

      # 這個 repo 的歷史被改寫過一次，就是為了移除真實主機名與組織名。
      # 這一關防止它們被重新帶回來。
      - name: No real identifiers or secrets
        run: |
          set -e
          # 比對真實 token 的完整格式，不是只比前綴。
          # 只比前綴會把 'xoxb-REPLACE_ME' 與說明文字一起報成警報，
          # 而會誤報的檢查最後一定會被關掉。
          if git grep -nIE 'xox[bp]-[0-9]{8,}-[0-9]{8,}-[A-Za-z0-9]{16,}|sk-ant-[A-Za-z0-9_-]{40,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}' ; then
            echo "::error::疑似真實憑證進入版控"; exit 1
          fi
          if git grep -nIE '\b(10|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b' -- ':!*.lock' ; then
            echo "::error::真實內部 IP 進入版控，請改用 <HOST-IP> 之類的佔位符"; exit 1
          fi
          if git grep -rn 'node_modules' -- .gitignore > /dev/null; then :; else
            echo "::error::.gitignore 未擋 node_modules"; exit 1
          fi
